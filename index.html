<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--ARTIFACT-START-->
<title>ZombiCraumia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Mono&family=PT+Sans:wght@400;700&family=Russo+One&display=swap">
<style>
/* Layout: a vertical 9:16 "reel" card centered on a dark page: story progress bar, scene art, caption, countdown, choices. Single dark look by design. */
:root {
  --night: #0b0d12;
  --card: #12151c;
  --line: #262c38;
  --ink: #ece8de;
  --muted: #8d94a3;
  --alarm: #e5483b;
  --ok: #4fc685;
  --warn: #f1b03f;
  --f-display: "Russo One", "Arial Black", Impact, sans-serif;
  --f-body: "PT Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono: "PT Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--ink); font-family: var(--f-body); font-size: 16px;
  display: grid; place-items: center; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  background-image: radial-gradient(ellipse at 50% 0%, rgba(229,72,59,.10), transparent 55%);
}
.reel {
  width: min(460px, 100%); height: min(880px, 100%); min-height: 0;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  display: flex; flex-direction: column; position: relative; box-shadow: 0 30px 80px rgba(0,0,0,.5);
}
.top { padding: 12px 14px 8px; display: grid; gap: 9px; }
.stories { display: flex; gap: 4px; min-height: 3px; }
.stories i { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.18); overflow: hidden; position: relative; }
.stories i.done { background: rgba(255,255,255,.85); }
.stories i.now::after { content: ""; position: absolute; inset: 0; width: var(--p, 0%); background: #fff; }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.meta span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta b { color: var(--ink); font-weight: 400; flex: none; }
.res { display: flex; gap: 6px; flex-wrap: wrap; min-height: 0; }
.res span { font-family: var(--f-mono); font-size: 11px; padding: 2px 7px; border: 1px solid var(--line); border-radius: 20px; color: var(--muted); font-variant-numeric: tabular-nums; }
.res span b { color: var(--ink); font-weight: 400; }
.res span.low b { color: var(--alarm); }

.art { position: relative; flex: 0 0 auto; aspect-ratio: 16 / 10; max-height: 32vh; width: 100%; background: #07090d; }
.art canvas { width: 100%; height: 100%; display: block; }
.tag {
  position: absolute; left: 12px; bottom: 10px; font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em;
  text-transform: uppercase; background: rgba(0,0,0,.6); padding: 3px 7px; border-radius: 3px; color: var(--warn);
}
.body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.caption { font-size: 18px; line-height: 1.42; margin: 0; text-wrap: pretty; }
.caption q { font-style: italic; color: #fff; }
.ask { font-family: var(--f-display); font-size: 21px; line-height: 1.15; margin: 0; text-wrap: balance; }
.ask span { color: var(--muted); font-family: var(--f-mono); font-size: 13px; }
.timer { height: 6px; border-radius: 3px; background: #1e232d; overflow: hidden; }
.timer i { display: block; height: 100%; width: 100%; background: var(--alarm); transform-origin: left; }
.timer-l { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-bottom: -6px; }
.timer-l b { color: var(--alarm); font-weight: 400; font-variant-numeric: tabular-nums; }
.choices { display: grid; gap: 8px; }
.choice {
  text-align: left; font: inherit; font-size: 16px; line-height: 1.3; color: var(--ink); cursor: pointer;
  background: #1a1f29; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start;
}
.choice:hover { border-color: #3b4456; background: #1e2430; }
.choice:focus-visible { outline: 2px solid var(--warn); outline-offset: 2px; }
.choice .k { font-family: var(--f-mono); font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-top: 2px; flex: none; }
.choice.sel { border-color: var(--warn); background: rgba(241,176,63,.1); }
.choice.sel .k { color: #111; background: var(--warn); border-color: var(--warn); }
.choice[disabled] { opacity: .45; cursor: default; }

.locs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.loc {
  text-align: left; font: inherit; color: var(--ink); cursor: pointer; background: #1a1f29; border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 11px; display: grid; gap: 4px; min-width: 0;
}
.loc:hover { border-color: #3b4456; }
.loc:focus-visible { outline: 2px solid var(--warn); outline-offset: 2px; }
.loc b { font-family: var(--f-display); font-weight: 400; font-size: 15px; line-height: 1.15; }
.loc small { color: var(--muted); font-size: 13px; line-height: 1.3; }
.loc em { font-style: normal; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .04em; color: var(--warn); }
.loc.rnd { grid-column: 1 / -1; border-style: dashed; }

.verdict { display: grid; gap: 10px; }
.stamp {
  justify-self: start; font-family: var(--f-display); font-size: 15px; letter-spacing: .06em; text-transform: uppercase;
  padding: 4px 10px; border: 2px solid currentColor; border-radius: 4px; transform: rotate(-2deg);
}
.stamp.good { color: var(--ok); } .stamp.bad { color: var(--alarm); } .stamp.mid { color: var(--warn); }
.outcome { font-size: 17px; line-height: 1.45; margin: 0; }
.outcome q { font-style: italic; color: #fff; }
.why { border-left: 3px solid var(--warn); padding: 4px 0 4px 12px; color: #cfcbc1; line-height: 1.45; font-size: 15px; }
.why.good { border-color: var(--ok); } .why.bad { border-color: var(--alarm); }
.why b { display: block; font-family: var(--f-mono); font-weight: 400; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--warn); margin-bottom: 3px; }
.btn {
  font-family: var(--f-display); font-size: 17px; letter-spacing: .02em; cursor: pointer;
  background: var(--ink); color: #111; border: 0; border-radius: 10px; padding: 13px 18px;
}
.btn.red { background: var(--alarm); color: #fff; }
.btn[disabled] { opacity: .4; cursor: default; }
.btn:focus-visible { outline: 2px solid var(--warn); outline-offset: 3px; }

.title-h { font-family: var(--f-display); font-weight: 400; font-size: clamp(38px, 11vw, 54px); line-height: .95; margin: 0; }
.title-h span { color: var(--alarm); }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--warn); }
.rules { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
.rules li { display: grid; grid-template-columns: 28px 1fr; gap: 8px; line-height: 1.4; color: #cfcbc1; font-size: 15px; }
.rules li b { font-family: var(--f-mono); font-weight: 400; color: var(--alarm); }
.end-h { font-family: var(--f-display); font-weight: 400; font-size: 30px; line-height: 1.05; margin: 0; text-wrap: balance; }
.score { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.score div { border-top: 1px solid var(--line); padding-top: 6px; font-family: var(--f-mono); }
.score span { display: block; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.score strong { font-weight: 400; font-size: 22px; font-variant-numeric: tabular-nums; }
.recap { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: 14px; line-height: 1.4; }
.recap li { display: grid; grid-template-columns: 14px 1fr; gap: 8px; color: #cfcbc1; }
.recap li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; background: var(--muted); }
.recap li.good::before { background: var(--ok); } .recap li.bad::before { background: var(--alarm); } .recap li.mid::before { background: var(--warn); }
.note { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.fade { animation: fade .35s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.shake { animation: shake .4s; }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
@media (prefers-reduced-motion: reduce) { .fade, .shake { animation: none; } }
@media (max-height: 640px) { .art { max-height: 24vh; } .caption { font-size: 16px; } }
@media (max-width: 360px) { .locs { grid-template-columns: 1fr; } }
</style>
<!--ARTIFACT-HEAD-END-->
</head>
<body>
<!--ARTIFACT-BODY-START-->
<main class="reel" id="reel">
  <div class="top">
    <div class="stories" id="stories"></div>
    <div class="meta"><span id="place">ZombiCraumia</span><b id="clock">—</b></div>
    <div class="res" id="res"></div>
  </div>
  <div class="art"><canvas id="art"></canvas><span class="tag" id="tag">Симферополь</span></div>
  <div class="body" id="body"></div>
</main>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- start locations (Симферополь) ----------
const LOCS = {
  home9:  { name: "Дом, 9 этаж", where: "ул. Балаклавская", place: "Кв. 47 · 9 этаж", sum: "Дома, высоко. Вода из крана, пока она есть.", res: "еда есть · воду надо набрать",
            water: 0, food: 3, charge: 35, kind: "home", door: "door", clock: "21:14", art: "tv",
            flow: ["news", "prep", "knock", "fire", "night", "supply", "radio"] },
  home1:  { name: "Дом, 1 этаж", where: "ул. Жуковского", place: "Кв. 3 · 1 этаж", sum: "Окна на уровне улицы. Сюда можно просто влезть.", res: "еда есть · окна уязвимы",
            water: 0, food: 3, charge: 40, kind: "home", door: "door", clock: "21:14", art: "tv",
            flow: ["news", "prep", "window1", "night", "supply", "radio"] },
  vape:   { name: "Вейп-шоп на Москольце", where: "площадь Москольцо", place: "Вейп-шоп · Москольцо", sum: "Ты на смене. Стеклянная витрина, ролета, подсобка.", res: "вода есть (кулер) · еды нет",
            water: 19, food: 0, charge: 70, kind: "shop", door: "glass", clock: "20:47", art: "vape", supply: "продуктовый через дорогу, у остановки на Москольце",
            flow: ["vapeOpen", "prep", "knock", "night", "supply", "radio"] },
  store:  { name: "Продуктовый на Киевской", where: "ул. Киевская", place: "Магазин · Киевская", sum: "Ты зашёл за хлебом. В зале человек тридцать.", res: "еда вокруг · толпа и паника",
            water: 2, food: 1, charge: 40, kind: "shop", door: "glass", clock: "20:31", art: "store",
            flow: ["storeOpen", "prep", "knock", "night", "radio"] },
  pharm:  { name: "Аптека на Пушкинской", where: "ул. Пушкинская", place: "Аптека · Пушкинская", sum: "Ты фармацевт. Сюда придут первые раненые.", res: "лекарства есть · еды нет",
            water: 10, food: 0, charge: 50, kind: "shop", door: "glass", clock: "20:58", art: "pharm", meds: true, supply: "круглосуточный продуктовый в соседнем доме",
            flow: ["pharmOpen", "prep", "night", "supply", "radio"] },
  garage: { name: "Гараж у Залесской", where: "гаражный кооператив", place: "Гараж №112", sum: "Ты возишься с машиной. Бак полный, воды нет.", res: "машина есть · воды нет",
            water: 0, food: 1, charge: 50, kind: "garage", door: "gate", clock: "19:52", art: "garage", car: true, supply: "сторожка кооператива, там кулер",
            flow: ["garageOpen", "prep", "night", "supply", "radio"] },
  street: { name: "Остановка на Кирова", where: "проспект Кирова", place: "Остановка · пр. Кирова", sum: "Ждёшь троллейбус. Ничего с собой, кроме телефона.", res: "ничего нет · самый сложный старт",
            water: 0, food: 0, charge: 25, kind: "street", door: "door", clock: "20:12", art: "street",
            flow: ["streetOpen", "shelter", "night", "supply", "radio"] },
};
const POINTS = ["Аэропорт «Симферополь»", "Стадион «Локомотив»", "Ж/д вокзал", "Площадь Ленина"];

// ---------- state ----------
let G;
function newRun(locId) {
  const L = LOCS[locId];
  const names = shuffle(POINTS.slice()).slice(0, 3);
  const kinds = shuffle(["safe", "overrun", "overrun"]);
  G = {
    locId, loc: L, flow: L.flow, fi: -1,
    water: L.water, charge: L.charge, stress: 20, food: L.food,
    f: { car: !!L.car, meds: !!L.meds }, log: [], good: 0, bad: 0,
    points: names.map((n, i) => ({ name: n, kind: kinds[i], tried: false })),
    guestBitten: chance(0.5), withGuest: false, guestName: L.kind === "home" ? "Лена" : "Даша", scouted: false, attempts: 0,
  };
}
const clampRes = () => { G.water = Math.max(0, Math.round(G.water)); G.food = Math.max(0, G.food); G.charge = Math.max(0, Math.min(100, G.charge)); G.stress = Math.max(0, Math.min(100, G.stress)); };
const NEXT = "@"; // continue along this start's flow

// ---------- scenes ----------
const S = {};

// --- home openings ---
S.news = {
  label: "Новости", art: "tv", timer: 7,
  place: g => g.loc.place, clock: "21:14",
  text: g => `Экстренный выпуск «Крым 24»: в Симферополе люди нападают на прохожих и кусают их — на Москольце, у вокзала, на Кирова. Укушенные через несколько минут <q>встают снова</q>. Ведущий обрывается на полуслове.${g.locId === "home1" ? " За окном первого этажа кто-то бежит по двору." : ""}`,
  ask: "Первые секунды. Что делаешь?",
  choices: [
    { t: "Набираю воду везде: ванна, чайник, кастрюли, все тазики", v: "good",
      tip: "Воду и свет в ЧС отключают одними из первых. Полная ванна — это 150–200 литров: пить, готовить, мочить тряпки при пожаре. В Симферополе вода и так по графику — кран может пересохнуть через час.",
      go: g => { g.water = 180; return { next: NEXT, out: "Шумит вода. Ванна, чайник, три кастрюли, ведро, даже бутылки из-под лимонада. Через сорок минут напор в кране слабеет." }; } },
    { t: "Бегу в магазин у дома за едой", v: "bad",
      tip: "В первые часы магазины — самое людное место. Давка, паника, и среди толпы уже есть укушенные, которые сами об этом не знают. Еда дома почти всегда есть на 3–5 дней.",
      go: g => chance(0.5)
        ? { end: "bitten", out: "У кассы давка. Мужчина в куртке хватается за твоё плечо, чтобы не упасть. На его шее — рваная рана. Поздно." }
        : (g.food += 2, g.stress += 25, { next: NEXT, out: "Ты успел: две сумки консервов. По дороге назад кто-то кричал в соседнем дворе. Руки трясутся." }) },
    { t: "Звоню родным, всех обзваниваю", v: "mid",
      tip: "Сеть ложится через минуты из-за перегрузки. Короткое SMS проходит, когда звонки уже не соединяются. Пиши коротко: «Я дома, жив, сиди дома, набери воду».",
      go: g => { g.charge -= 20; g.stress -= 5; return { next: NEXT, out: "Мама ответила с третьего раза. Связь рвётся. Ты теряешь пять минут и 20% заряда." }; } },
    { t: "Выхожу на лестницу посмотреть, что происходит", v: "bad",
      tip: "Любопытство — главный убийца в фильмах и в реальных ЧС. Информацию получай из окна, радио и новостей, а не своими глазами в подъезде.",
      go: g => chance(0.35)
        ? { end: "bitten", out: "На площадке кто-то сидит на корточках. Он поднимает голову и бросается быстрее, чем ты успеваешь закрыть дверь." }
        : (g.stress += 20, { next: NEXT, out: "Снизу слышен крик и топот. Ты захлопываешь дверь. Ничего полезного ты не узнал." }) },
  ],
  timeout: { v: "bad", tip: "Ступор — нормальная реакция, но в ЧС первые минуты решают всё. Выучи заранее 2–3 действия «на автомате»: вода, дверь, заряд.",
    go: g => { g.stress += 15; g.water = 20; return { next: NEXT, out: "Ты застыл перед телевизором. Когда наконец пошёл к крану, напор уже еле течёт. Успел набрать одно ведро." }; } },
};

S.window1 = {
  label: "Окно", art: "window", timer: 9, place: g => g.loc.place, clock: "22:10",
  text: g => `${g.f.windows1 ? "Сквозь щель между шкафом и рамой видно: " : ""}В окно первого этажа колотит мужчина. За ним по двору, метрах в тридцати, бредут двое. <q>Открой окно! Пусти, они идут!</q>`,
  ask: "Он прямо за стеклом.",
  choices: [
    { t: "Открываю окно и затаскиваю его", v: "bad", tip: "Сначала проверка, потом помощь. Открытое окно первого этажа — это вход не только для него, но и для тех, кто идёт следом.",
      go: g => chance(0.45) ? { end: "bitten", out: "Ты распахиваешь створку. Он хватается за твои руки — ладони мокрые и горячие. На предплечье свежий укус." }
        : (g.withGuest = true, g.guestBitten = false, g.guestName = "Артём", { next: NEXT, out: "Ты затаскиваешь его внутрь и захлопываешь окно за секунду до того, как первый из них дотягивается до подоконника." }) },
    { t: "Кричу через стекло: «Покажи руки и шею!»", v: "good", tip: "Как в роликах: «Покажи руки». Укусы чаще всего на кистях, предплечьях и шее. Проверка через стекло ничего не стоит.",
      go: g => g.guestBitten
        ? (g.stress += 15, { next: NEXT, out: "Он поднимает руки. На левой — укус, кровь течёт к локтю. Ты задёргиваешь штору и уходишь в коридор. Стук за окном продолжается долго." })
        : (g.withGuest = true, g.guestName = "Артём", g.stress -= 10, { next: NEXT, out: "Руки, шея — чисто. Ты открываешь окно, он влезает, вы вдвоём подпираете раму шкафом. Его зовут Артём." }) },
    { t: "Задёргиваю шторы и отхожу от окна", v: "mid", tip: "Безопасно, но человек снаружи привлекает к твоему окну тех, кто идёт следом. Первый этаж нужно укреплять заранее.",
      go: g => { g.stress += 15; return { next: NEXT, out: "Он бьёт по стеклу ещё минуту, потом крик переходит в хрип. Ты не смотришь." }; } },
  ],
  timeout: { v: "mid", tip: "Пока ты думал, всё решилось за тебя.", go: g => { g.stress += 15; return { next: NEXT, out: "Стук прекращается. За окном шарканье." }; } },
};

// --- vape shop on Moskoltso ---
S.vapeOpen = {
  label: "Смена", art: "vape", timer: 8, place: g => g.loc.place, clock: "20:47",
  text: "В шоп влетает парень без куртки: <q>На Москольце людей жрут! У остановки, у троллейбусов!</q> В зале ещё двое покупателей. За стеклом по кольцу бегут люди, сигналят машины.",

  text: g => g.loc.kind === "home" ? (g.water > 100 ? "Вода набрана. В подъезде пока тихо. Есть минута, пока внизу не начался шум." : "В подъезде пока тихо. Есть минута, пока внизу не начался шум.")
    : g.loc.kind === "shop" ? (g.locId === "store" ? "Ты на складе. Охранник куда-то пропал. Дверь склада закрывается изнутри. Есть минута." : "Ролета опущена. На улице крики и сигнализации. Есть минута, чтобы подготовиться.")
    : "Ворота закрыты. В кооперативе пока тихо. Есть минута.",
  ask: "Выбери три дела",
  choices: g => PREP[g.loc.kind](g),
  timeout: { v: "mid", tip: "Если не успел выбрать — сделай хотя бы одно: закрой дверь. Это базовое действие.", go: g => { g.f.door = true; } },
  after: g => {
    if (g.f.co) return { end: "co", out: "Тепло, гудит мотор. Ты засыпаешь в машине. Ворота закрыты." };
    if (g.locId === "vape" && !g.f.bottles) g.water = Math.min(g.water, 19);
    return null;
  },
};

// --- shared: knock ---
S.knock = {

  enter: g => { if (g.loc.door === "glass") g.guestName = "Даша"; },
  text: g => g.loc.door === "glass"
    ? `${g.f.lit ? "Вывеска горит, и на свет пришли. " : ""}В ${g.f.shutter ? "ролету" : "дверь"} колотят. Девичий голос: <q>Откройте! Я с остановки, они везде! Пожалуйста!</q>`
    : `${g.f.loud ? "Музыка ещё играет, когда " : ""}в дверь колотят. Голос соседки с 8-го этажа: <q>Пусти, пожалуйста! Они на лестнице! Я одна!</q>`,
  ask: "Что делаешь?",
  choices: [
    { t: "Открываю сразу — человек же в беде", v: "bad", tip: "Сначала проверка, потом помощь. Пустить человека, не посмотрев на руки и шею, — значит поставить на кон и себя, и его.",
      go: g => { if (chance(g.f.door ? 0.15 : 0.3)) return { end: "bitten", out: "Ты открываешь. За ней из темноты выныривает чья-то рука и хватает тебя за запястье." };
        g.withGuest = true; return { next: NEXT, out: `Она влетает внутрь, ты закрываешь. Она плачет и держится за руку. Её зовут ${g.guestName}.` }; } },
    { t: g => g.loc.door === "glass" ? "Приподнимаю ролету на ладонь: «Покажи руки и шею»" : "Говорю через дверь: «Покажи руки и шею в глазок»", v: "good",
      tip: "Как в роликах: «Покажи руки». Укусы чаще всего на кистях, предплечьях и шее. Проверка занимает 10 секунд и ничего не стоит.",
      go: () => ({ next: "peephole", out: "Секунда тишины. Потом она поднимает руки." }) },
    { t: "Молчу и не подхожу", v: "mid", tip: "Не открывать — безопасно, но человек снаружи может стать союзником: вдвоём легче дежурить ночью.",
      go: g => { g.stress += 15; return { next: NEXT, out: "Она стучит ещё минуту, потом её шаги удаляются. Ты долго не можешь отойти." }; } },
  ],
  timeout: { v: "mid", tip: "Нерешительность тоже решение: ты не открыл.", go: g => { g.stress += 10; return { next: NEXT, out: "Пока ты думал, стук прекратился." }; } },
};
S.peephole = {
  label: "Проверка", art: "peephole", timer: 9, place: g => g.loc.place, clock: "22:03",
  text: g => g.guestBitten
    ? "Она поднимает руки. На правом запястье — свежая повязка, сквозь бинт проступает кровь. <q>Это я порезалась, честно! Пусти!</q>"
    : "Она поднимает руки, поворачивается, оттягивает воротник. Руки и шея чистые. Только ссадина на колене — упала, когда бежала.",
  ask: g => g.guestBitten ? "Повязка на руке. Решай." : "Чисто. Решай.",
  choices: g => g.guestBitten ? [
    { t: "Впускаю. Вдруг правда порезалась", v: "bad", tip: "Свежая повязка на руке в первые часы — главный тревожный знак. Укушенные часто скрывают укус, даже от себя.", go: g => { g.withGuest = true; return { next: NEXT, out: "Ты открываешь. Она благодарит и сразу уходит в угол, прижимая руку к груди." }; } },
    { t: "Не открываю. Подсказываю, где спрятаться", v: "good", tip: "Жёстко, но правильно. Ты не бросил её совсем — подсказал, куда идти. Помочь можно и не открывая.", go: g => { g.stress += 10; return { next: NEXT, out: "Она долго молчит, потом уходит. Через час снаружи слышны тяжёлые, медленные шаги." }; } },
    { t: "Передаю бутылку воды в щель", v: "mid", tip: "Доброе дело, но каждое открытие — риск контакта. Помогай через закрытую щель, без касаний.", go: g => chance(0.3) ? { end: "bitten", out: "Ты приоткрываешь щель. Её пальцы цепляются за твою руку — уже не её пальцы." } : (g.water -= 1, { next: NEXT, out: "Она хватает бутылку и уходит. Ты закрываешь и долго моешь руки." }) },
  ] : [
    { t: "Впускаю", v: "good", tip: "Проверка пройдена — помогай. Вдвоём можно дежурить по очереди и делить работу.", go: g => { g.withGuest = true; g.stress -= 15; g.food += 1; return { next: NEXT, out: `Её зовут ${g.guestName}. В рюкзаке у неё пачка печенья и пауэрбанк.` }; } },
    { t: "Всё равно не открываю", v: "mid", tip: "Осторожность понятна, но проверка показала: человек чист. Союзник повышает шансы.", go: g => { g.stress += 10; return { next: NEXT, out: "Она уходит, всхлипывая." }; } },
  ],
  timeout: { v: "mid", tip: "Ты не решился.", go: () => ({ next: NEXT, out: "Она устала ждать и ушла." }) },
};

// --- fire (high floor only) ---
S.fire = {
  label: "Пожар", art: "smoke", timer: 9, place: g => g.loc.place, clock: "01:30",
  text: g => `Запах гари. В окне подъезда — оранжевые отсветы: горит 5-й этаж. Ты на 9-м. Дым поднимается по лестнице${g.f.windows ? ", и через открытые окна он уже тянется в комнату" : ""}.`,
  ask: "Пожар ниже тебя. Твои действия?",
  choices: [
    { t: "Бегу вниз по лестнице, пока не поздно", v: "bad", tip: "Пожар ниже — вниз не бежать. Дым поднимается быстрее человека, на лестнице ноль видимости, а внизу ещё и заражённые.", go: () => chance(0.7) ? { end: "smoke", out: "На 7-м этаже дым такой, что ты не видишь своих рук. Ты кашляешь, теряешь перила…" } : { end: "bitten", out: "Ты прорвался сквозь дым до 4-го. Там, в темноте, кто-то стоит на площадке." } },
    { t: "Вызываю лифт", v: "bad", tip: "Лифт при пожаре — ловушка: шахта работает как труба для дыма, электричество отключается, кабина застревает.", go: () => ({ end: "smoke", out: "Лифт приходит. На 6-м он дёргается и встаёт. Через щели ползёт дым." }) },
    { t: "Мочу тряпки и затыкаю щели под входной дверью", v: "good", tip: "Мокрая ткань под дверью держит дым. Квартира с закрытой дверью защищает от огня 30–60 минут. Остаёшься внутри и ждёшь помощи.", go: g => {
      if (g.water >= 10) { g.water -= 10; return { next: "fire2", out: "Ты черпаешь воду из ванны, мочишь полотенца и плотно затыкаешь щель. Дым больше не просачивается." }; }
      g.stress += 15; return { next: "fire2", out: "Ты открываешь кран — оттуда только хрип. Воды нет. Ты мочишь тряпки остатками из чайника, их хватает едва на одну щель." }; } },
    { t: "Выхожу на балкон и зову на помощь", v: "mid", tip: "Балкон — правильное место, если дым уже в квартире. Но сначала закрой щели, а кричать в зомби-апокалипсис — звать всех подряд.", go: g => { g.stress += 10; return { next: "fire2", out: "Внизу на твой крик оборачиваются несколько фигур. Они медленно идут к подъезду." }; } },
  ],
  timeout: { v: "bad", tip: "Запомни: пожар ниже — закрыться, мокрая ткань под дверь, звонок 112.", go: g => { g.stress += 20; return { next: "fire2", out: "Пока ты думал, в прихожей повисла сизая пелена." }; } },
};
S.fire2 = {
  label: "Пожар", art: "smoke", timer: 9, place: g => g.loc.place, clock: "01:41",
  text: g => `${g.withGuest ? g.guestName + " кашляет. " : ""}Дыма в квартире всё больше. Пожар внизу не утихает.`,
  ask: "Что дальше?",
  choices: [
    { t: "Звоню 112 и называю адрес, этаж и номер квартиры", v: "good", tip: "Даже в хаосе пожарные приоритетно едут на жилые дома. Точный адрес, этаж и «в квартире люди» — три вещи, которые надо сказать.", go: g => {
      if (g.charge < 15) { g.stress += 20; return { next: NEXT, out: "Телефон гаснет на первом гудке. Заряда нет. Ты ложишься на пол и ждёшь." }; }
      g.charge -= 15; return { next: NEXT, out: "Диспетчер говорит, что машина рядом. Через сорок минут сирена воет у подъезда, огонь гасят." }; } },
    { t: "Ложусь на пол у окна, дышу через мокрую ткань", v: "good", tip: "У пола воздух чище: дым и жар собираются наверху. Мокрая ткань у лица фильтрует часть сажи.", go: g => { g.stress += 5; return { next: NEXT, out: "Ты лежишь у окна с мокрым полотенцем. К утру огонь гаснет: бетонные перекрытия выдержали." }; } },
    { t: "Распахиваю окна и входную дверь для сквозняка", v: "bad", tip: "Сквозняк — это кислород для огня и тяга, которая втягивает дым из подъезда в квартиру. Окно открывают только в комнате с закрытой дверью.", go: g => chance(0.5) ? { end: "smoke", out: "Тяга втягивает дым из подъезда, как в трубу. Через минуту в квартире ничего не видно." } : (g.stress += 25, { next: NEXT, out: "Дым валит внутрь. Ты успеваешь захлопнуть дверь и полчаса кашляешь на балконе." }) },
  ],
  timeout: { v: "mid", tip: "При задымлении: пол, мокрая ткань, окно в изолированной комнате, звонок 112.", go: g => { g.stress += 15; return { next: NEXT, out: "Ты сидишь в ванной с мокрым полотенцем на лице. К утру огонь утихает." }; } },
};

// --- shared: night ---
S.night = {
  label: "Ночь", art: "night", timer: 9, place: g => g.loc.place, clock: "03:40",
  text: g => {
    if (g.withGuest && g.guestBitten) return `${g.guestName} тяжело дышит в углу. Горячий лоб, повязка на руке почернела. Она не отвечает на имя и медленно поворачивает голову на звук твоих шагов.`;
    const hunger = g.food <= 0 ? " Живот сводит: ты не ел с обеда." : "";
    const where = g.loc.door === "glass" ? `скребёт по ${g.f.shutter ? "ролете" : "стеклу"}` : g.loc.door === "gate" ? "трётся о ворота гаража" : "царапает входную дверь";
    return `${g.f.posted ? "Кто-то нашёл твою сторис. " : ""}Тишину режет скрежет: кто-то ${where}. Медленно, без остановки${g.f.door ? ". Подпорка скрипит, но держит" : ""}.${hunger}`;
  },
  ask: g => g.withGuest && g.guestBitten ? "Она обращается. Сейчас." : "Что делаешь?",
  choices: g => g.withGuest && g.guestBitten ? [
    { t: g.loc.kind === "home" ? "Запираю её в ванной и подпираю дверь" : "Запираю её в подсобке и подпираю дверь", v: "good", tip: "Жестокий выбор, но правильный: изолировать, не касаясь. Заманить звуком, закрыть дверь, подпереть.", go: g => { g.stress += 25; if (g.loc.kind === "home") g.water = Math.min(g.water, 20); g.withGuest = false; return { next: NEXT, out: `Ты заманиваешь её звуком и захлопываешь дверь. Всю ночь изнутри скребут.${g.loc.kind === "home" ? " Воду из ванны ты потерял." : ""}` }; } },
    { t: "Подхожу проверить — может, это просто жар", v: "bad", tip: "Никогда не подходи к человеку с признаками обращения. Жар, мутный взгляд, реакция только на звук — дистанция несколько метров.", go: () => ({ end: "bitten", out: "Ты кладёшь ладонь ей на лоб. Она открывает глаза." }) },
    { t: "Убегаю наружу", v: "mid", tip: "Бегство спасает сейчас, но ты остаёшься без убежища и запасов в 4 утра.", go: g => chance(0.5) ? { end: "bitten", out: "Снаружи темно. Ты спотыкаешься о кого-то, кто сидит у входа." } : (g.water = 0, g.food = 0, g.stress += 30, g.withGuest = false, { next: NEXT, out: "Ты прячешься в соседнем подъезде до утра. Вода и еда остались там." }) },
  ] : [
    { t: "Свечу фонариком, чтобы посмотреть, кто там", v: "bad", tip: "Свет и движение выдают, что внутри кто-то есть. Заражённые реагируют на свет, звук и запах.", go: g => { g.stress += 15; if (!g.f.door && chance(0.4)) return { end: "bitten", out: "Ты подносишь фонарь. Удар — замок вылетает." }; return { next: NEXT, out: "Серое лицо с открытым ртом. Скрежет переходит в удары. До рассвета он не уходит." }; } },
    { t: "Ухожу вглубь и сижу тихо", v: "good", tip: "Тишина и неподвижность — лучшая маскировка. Не провоцируй. Через какое-то время он потеряет интерес.", go: g => { g.stress += 5; return { next: NEXT, out: "Ты сидишь в дальнем углу, не дыша. Через полчаса скрежет стихает, шаги удаляются." }; } },
    { t: "Кричу: «Кто там?!»", v: "bad", tip: "Голос — подтверждение, что внутри живой. Если надо говорить — тихо и коротко.", go: g => { g.stress += 20; return { next: NEXT, out: "Скрежет замирает. Потом начинают бить всем телом. К утру их трое." }; } },
  ],
  timeout: { v: "mid", tip: "Замереть в страхе — тоже тишина. Сработало.", go: g => { g.stress += 10; return { next: NEXT, out: "Ты застыл, не дыша. К утру всё стихло." }; } },
};

// --- shared: supplies (only if something is missing) ---
S.supply = {
  label: "Запасы", art: "dawn", timer: 10, place: g => g.loc.place, clock: "06:15",
  skip: g => g.food > 0 && g.water >= 5,
  text: g => {
    const noWater = g.water < 5, noFood = g.food <= 0;
    const what = noWater && noFood ? "Нет ни воды, ни еды." : noWater ? "Воды почти не осталось. Пить хочется так, что больно глотать." : "Еды нет. Вода есть, но живот сводит, голова кружится.";
    return `Рассвет. ${what} ${g.loc.supply ? "Ближайший шанс — " + g.loc.supply + "." : "В доме напротив разбита витрина магазина."}`;
  },
  ask: "Как быть с запасами?",
  choices: g => {
    const noWater = g.water < 5;
    const list = [
      { t: "Выхожу сейчас, на рассвете: тихо, быстро, только самое нужное", v: "good", tip: "Рассвет — лучшее время для вылазки: светло, а улицы пусты. План заранее: куда, что взять, как вернуться. Не больше 10 минут.",
        go: g => chance(g.f.dark ? 0.1 : 0.18) ? { end: "bitten", out: "Между стеллажами темно. Ты тянешься к полке с водой, и из-под неё тебя хватают за руку." }
          : (g.food += 3, g.water += 12, { next: NEXT, out: "Ты возвращаешься через восемь минут: пять бутылок воды, тушёнка, хлебцы. Сердце колотится, но руки целы." }) },
      { t: "Иду прямо сейчас, пока темно — меня не увидят", v: "bad", tip: "В темноте не видишь ты, а они ориентируются на звук. Ночные вылазки — для тех, у кого есть фонарь, план и напарник.",
        go: () => chance(0.45) ? { end: "bitten", out: "Ты не видишь, что лежащий у входа человек шевелится." } : (G.food += 2, G.water += 6, { next: NEXT, out: "Ты наощупь сгребаешь что-то с полок и бегом возвращаешься. Повезло." }) },
    ];
    if (noWater) list.push({ t: g.loc.kind === "garage" ? "Пью из радиатора машины" : "Сливаю воду из бачка унитаза и бойлера, кипячу", v: g.loc.kind === "garage" ? "bad" : "good",
      tip: g.loc.kind === "garage" ? "В радиаторе антифриз — он ядовит. Даже немного вызывает тяжёлое отравление." : "В бачке унитаза (не в чаше!) и в бойлере десятки литров водопроводной воды. Прокипяти — и её можно пить.",
      go: g => g.loc.kind === "garage" ? { end: "poison", out: "Сладковатый вкус. Через час тебя скручивает." } : (g.water += 15, { next: NEXT, out: "Бачок, бойлер, батарея — набирается почти двадцать литров. На газовой горелке ты кипятишь первую кастрюлю." }) });
    else list.push({ t: "Не рискую: без еды можно продержаться, вода есть", v: "good", tip: "Правило трёх: 3 минуты без воздуха, 3 дня без воды, 3 недели без еды. Если вода есть, голод — не повод рисковать жизнью.",
      go: g => { g.stress += 15; return { next: NEXT, out: "Ты пьёшь воду маленькими глотками и обманываешь желудок. Голова кружится, но ты в безопасности." }; } });
    return list;
  },
  timeout: { v: "mid", tip: "Ты не решился. Хорошо, если вода есть.", go: g => { g.stress += 15; if (g.water < 5) return { end: "thirst", out: "Ты ждёшь ещё сутки. Потом ещё." }; return { next: NEXT, out: "Ты остаёшься на месте, голодный." }; } },
};

// --- radio & choosing a point ---

      <p class="caption">Ты обычный человек: без оружия и без опыта. Апокалипсис начинается прямо сейчас, и на каждое решение у тебя есть секунды.</p>
      <ul class="rules">
        <li><b>01</b>Любое касание заражённого — это укус. Конец игры.</li>
        <li><b>02</b>Не успел решить — значит застыл. У ступора тоже есть последствия.</li>
        <li><b>03</b>Часть пунктов эвакуации уже пала. Сначала разведай.</li>
        <li><b>04</b>После каждого выбора — объяснение, почему так. Это работает и в реальных ЧС.</li>
      </ul>
      <p class="eyebrow" style="margin:4px 0 0">Где тебя застало?</p>
      <div class="locs">${ids.map(id => { const L = LOCS[id]; return `<button class="loc" type="button" data-loc="${id}"><b>${esc(L.name)}</b><small>${esc(L.sum)}</small><em>${esc(L.res)}</em></button>`; }).join("")}
        <button class="loc rnd" type="button" data-loc="random"><b>Случайное место</b><small>Как в жизни: не выбираешь, где тебя застанет.</small></button></div>
      <span class="note">Клавиши 1–7 выбирают ответ, Enter — дальше</span>
    </div>`;
  $("body").scrollTop = 0;
  document.querySelectorAll(".loc").forEach(el => el.onclick = () => startRun(el.dataset.loc === "random" ? pick(ids) : el.dataset.loc));
}
function startRun(loc) { newRun(loc); show(G.flow[0]); }
addEventListener("keydown", e => {
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 9) { const el = document.querySelector(`.choice[data-i="${n - 1}"]`); if (el && !el.disabled) el.click(); }
  if (e.key === "Enter") { const d = $("done"); const b = $("next") || $("retry") || (d && !d.disabled ? d : null); if (b && document.activeElement !== b) { e.preventDefault(); b.click(); } }
});
sizeArt(); requestAnimationFrame(drawArt);
menu();
window.__zc = { S, LOCS, get G() { return G; }, show, startRun }; // for automated tests
})();
