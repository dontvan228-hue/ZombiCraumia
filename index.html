<title>ZombiCraumia</title>

<style>
/* Layout: a vertical 9:16 "reel" card centered on a dark page: story progress bar, scene art, caption, countdown, choices. Single dark look by design. */
:root {
  --night: #0b0d12;
  --card: #12151c;
  --line: #262c38;
  --ink: #ece8de;
  --muted: #8d94a3;
  --alarm: #e5483b;
  --ok: #4fc685;
  --warn: #f1b03f;
  --f-display: "Russo One", "Arial Black", Impact, sans-serif;
  --f-body: "PT Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono: "PT Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--ink); font-family: var(--f-body); font-size: 16px;
  display: grid; place-items: center; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  background-image: radial-gradient(ellipse at 50% 0%, rgba(229,72,59,.10), transparent 55%);
}
.reel {
  width: min(460px, 100%); height: min(880px, 100%); min-height: 0;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  display: flex; flex-direction: column; position: relative; box-shadow: 0 30px 80px rgba(0,0,0,.5);
}
.top { padding: 12px 14px 8px; display: grid; gap: 9px; }
.stories { display: flex; gap: 4px; min-height: 3px; }
.stories i { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.18); overflow: hidden; position: relative; }
.stories i.done { background: rgba(255,255,255,.85); }
.stories i.now::after { content: ""; position: absolute; inset: 0; width: var(--p, 0%); background: #fff; }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.meta span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta b { color: var(--ink); font-weight: 400; flex: none; }
.res { display: flex; gap: 6px; flex-wrap: wrap; min-height: 0; }
.res span { font-family: var(--f-mono); font-size: 11px; padding: 2px 7px; border: 1px solid var(--line); border-radius: 20px; color: var(--muted); font-variant-numeric: tabular-nums; }
.res span b { color: var(--ink); font-weight: 400; }
.res span.low b { color: var(--alarm); }

.art { position: relative; flex: 0 0 auto; aspect-ratio: 16 / 10; max-height: 32vh; width: 100%; background: #07090d; }
.art canvas { width: 100%; height: 100%; display: block; }
.tag {
  position: absolute; left: 12px; bottom: 10px; font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em;
  text-transform: uppercase; background: rgba(0,0,0,.6); padding: 3px 7px; border-radius: 3px; color: var(--warn);
}
.body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.caption { font-size: 18px; line-height: 1.42; margin: 0; text-wrap: pretty; }
.caption q { font-style: italic; color: #fff; }
.ask { font-family: var(--f-display); font-size: 21px; line-height: 1.15; margin: 0; text-wrap: balance; }
.ask span { color: var(--muted); font-family: var(--f-mono); font-size: 13px; }
.timer { height: 6px; border-radius: 3px; background: #1e232d; overflow: hidden; }
.timer i { display: block; height: 100%; width: 100%; background: var(--alarm); transform-origin: left; }
.timer-l { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-bottom: -6px; }
.timer-l b { color: var(--alarm); font-weight: 400; font-variant-numeric: tabular-nums; }
.choices { display: grid; gap: 8px; }
.choice {
  text-align: left; font: inherit; font-size: 16px; line-height: 1.3; color: var(--ink); cursor: pointer;
  background: #1a1f29; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start;
}
.choice:hover { border-color: #3b4456; background: #1e2430; }
.choice:focus-visible { outline: 2px solid var(--warn); outline-offset: 2px; }
.choice .k { font-family: var(--f-mono); font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-top: 2px; flex: none; }
.choice.sel { border-color: var(--warn); background: rgba(241,176,63,.1); }
.choice.sel .k { color: #111; background: var(--warn); border-color: var(--warn); }
.choice[disabled] { opacity: .45; cursor: default; }

.locs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.loc {
  text-align: left; font: inherit; color: var(--ink); cursor: pointer; background: #1a1f29; border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 11px; display: grid; gap: 4px; min-width: 0;
}
.loc:hover { border-color: #3b4456; }
.loc:focus-visible { outline: 2px solid var(--warn); outline-offset: 2px; }
.loc b { font-family: var(--f-display); font-weight: 400; font-size: 15px; line-height: 1.15; }
.loc small { color: var(--muted); font-size: 13px; line-height: 1.3; }
.loc em { font-style: normal; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .04em; color: var(--warn); }
.diff { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .04em; color: var(--muted); }
.diff.d4, .diff.d5 { color: var(--alarm); } .diff.d3 { color: var(--warn); } .diff.d1, .diff.d2 { color: var(--ok); }
.loc.rnd { grid-column: 1 / -1; border-style: dashed; }

.verdict { display: grid; gap: 10px; }
.stamp {
  justify-self: start; font-family: var(--f-display); font-size: 15px; letter-spacing: .06em; text-transform: uppercase;
  padding: 4px 10px; border: 2px solid currentColor; border-radius: 4px; transform: rotate(-2deg);
}
.stamp.good { color: var(--ok); } .stamp.bad { color: var(--alarm); } .stamp.mid { color: var(--warn); }
.outcome { font-size: 17px; line-height: 1.45; margin: 0; }
.outcome q { font-style: italic; color: #fff; }
.why { border-left: 3px solid var(--warn); padding: 4px 0 4px 12px; color: #cfcbc1; line-height: 1.45; font-size: 15px; }
.why.good { border-color: var(--ok); } .why.bad { border-color: var(--alarm); }
.why b { display: block; font-family: var(--f-mono); font-weight: 400; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--warn); margin-bottom: 3px; }
.btn {
  font-family: var(--f-display); font-size: 17px; letter-spacing: .02em; cursor: pointer;
  background: var(--ink); color: #111; border: 0; border-radius: 10px; padding: 13px 18px;
}
.btn.red { background: var(--alarm); color: #fff; }
.btn[disabled] { opacity: .4; cursor: default; }
.btn:focus-visible { outline: 2px solid var(--warn); outline-offset: 3px; }

.title-h { font-family: var(--f-display); font-weight: 400; font-size: clamp(38px, 11vw, 54px); line-height: .95; margin: 0; }
.title-h span { color: var(--alarm); }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--warn); }
.rules { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
.rules li { display: grid; grid-template-columns: 28px 1fr; gap: 8px; line-height: 1.4; color: #cfcbc1; font-size: 15px; }
.rules li b { font-family: var(--f-mono); font-weight: 400; color: var(--alarm); }
.end-h { font-family: var(--f-display); font-weight: 400; font-size: 30px; line-height: 1.05; margin: 0; text-wrap: balance; }
.score { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.score div { border-top: 1px solid var(--line); padding-top: 6px; font-family: var(--f-mono); }
.score span { display: block; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.score strong { font-weight: 400; font-size: 22px; font-variant-numeric: tabular-nums; }
.recap { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: 14px; line-height: 1.4; }
.recap li { display: grid; grid-template-columns: 14px 1fr; gap: 8px; color: #cfcbc1; }
.recap li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; background: var(--muted); }
.recap li.good::before { background: var(--ok); } .recap li.bad::before { background: var(--alarm); } .recap li.mid::before { background: var(--warn); }
.act { display: flex; flex-direction: column; gap: 8px; height: 100%; min-height: 0; }
.say { font-size: 15px; line-height: 1.4; min-height: 2.8em; }
.say b { color: var(--warn); font-weight: 700; }
.stage { position: relative; flex: 1 1 auto; min-height: 300px; border-radius: 8px; overflow: hidden; touch-action: none; background: #07090d; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.abtn { position: absolute; right: 12px; bottom: 12px; width: 76px; height: 76px; border-radius: 50%; border: 2px solid var(--warn); background: rgba(241,176,63,.18); color: var(--ink); font-family: var(--f-display); font-size: 15px; touch-action: none; }
.ibtns[hidden], .abtn[hidden] { display: none; }
.ibtns { position: absolute; left: 12px; right: 12px; bottom: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.prompt { font-family: var(--f-mono); font-size: 13px; min-height: 1.5em; color: var(--ink); }
.prompt b { color: var(--warn); font-weight: 400; }
.prompt kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 4px; padding: 0 5px; background: #1a1f29; }
.nbar { display: inline-block; width: 140px; height: 8px; background: #1e232d; border-radius: 4px; overflow: hidden; vertical-align: middle; }
.nbar i { display: block; height: 100%; background: var(--alarm); }
.gl { position: absolute; inset: 0; }
.gl canvas { width: 100%; height: 100%; display: block; }
.cross { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255,255,255,.55); pointer-events: none; }
.tlabel { position: absolute; transform: translate(-50%, -130%); background: var(--warn); color: #15110a; font-family: var(--f-mono); font-size: 12px; padding: 4px 8px; border-radius: 6px; pointer-events: none; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; animation: bob 1s ease-in-out infinite; }
.tlabel::after { content: ""; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: var(--warn); }
.tlabel.edge { top: 46%; transform: none; animation: none; }
.tlabel.edge::after { display: none; }
.tlabel.edge.l { left: 8px; } .tlabel.edge.r { right: 8px; left: auto; }
@keyframes bob { 50% { transform: translate(-50%, -150%); } }
.edgew { position: absolute; font-family: var(--f-display); font-size: 15px; color: #fff; background: rgba(229,72,59,.85); padding: 4px 10px; border-radius: 4px; pointer-events: none; animation: flash 0.6s infinite alternate; }
.edgew.left { left: 8px; top: 30%; } .edgew.right { right: 8px; top: 30%; } .edgew.back { left: 50%; bottom: 64px; transform: translateX(-50%); }
.vign { position: absolute; inset: 0; pointer-events: none; transition: box-shadow .2s; }
.gest { position: absolute; left: 10px; right: 10px; bottom: 10px; background: rgba(10,12,18,.88); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 52px 1fr; gap: 6px 10px; align-items: center; pointer-events: none; }
.gest .btn { grid-column: 1 / -1; pointer-events: auto; padding: 8px; font-size: 14px; }
.gtext { font-size: 14px; line-height: 1.35; }
.gtext b { color: var(--warn); }
.gtext small { display: block; color: var(--muted); font-family: var(--f-mono); font-size: 11px; margin-top: 2px; }
.gicon { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--warn); display: grid; place-items: center; font-size: 26px; color: var(--warn); }
.gicon.down { animation: gdown 0.9s ease-in infinite; }
.gicon.turn { animation: gturn 1.2s linear infinite; } .gicon.turnl { animation: gturn 1.2s linear infinite reverse; }
.gicon.hold { animation: ghold 1s ease-in-out infinite; }
@keyframes gdown { from { transform: translateY(-8px); opacity: .4; } to { transform: translateY(8px); opacity: 1; } }
@keyframes gturn { to { transform: rotate(360deg); } }
@keyframes ghold { 50% { transform: scale(.85); background: rgba(241,176,63,.25); } }
.pmeter { grid-column: 1 / -1; position: relative; height: 14px; background: #1e232d; border-radius: 7px; overflow: hidden; }
.pmeter .zone { position: absolute; left: 60%; width: 35%; top: 0; bottom: 0; background: rgba(79,198,133,.75); }
.pmeter .needle { position: absolute; top: -2px; bottom: -2px; width: 4px; margin-left: -2px; background: #fff; }
.pmeter .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--warn); }
.insp { position: absolute; inset: 0; width: 100%; height: 100%; }
.nav { position: absolute; left: 10px; right: 10px; top: 10px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
.nbtn { pointer-events: auto; font-family: var(--f-mono); font-size: 12px; color: var(--ink); background: rgba(10,12,18,.8); border: 1px solid var(--line); border-radius: 18px; padding: 7px 12px; cursor: pointer; }
.nbtn.on { border-color: var(--ok); color: var(--ok); }
.nbtn.glow { border-color: var(--warn); color: #15110a; background: var(--warn); animation: ghold 1s infinite; }
.intro { position: absolute; inset: 0; background: rgba(8,10,15,.9); display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 18px; font-size: 15px; line-height: 1.4; }
.intro b { font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.intro span { color: #cfcbc1; }
.step { font-family: var(--f-mono); font-size: 13px; color: var(--warn); min-height: 1.4em; }
.gest[hidden], .tlabel[hidden], .edgew[hidden], .insp[hidden], .intro[hidden] { display: none; }
.aimtip { position: absolute; left: 50%; top: calc(50% + 14px); transform: translateX(-50%); background: rgba(10,12,18,.85); border: 1px solid var(--warn); color: var(--ink); font-family: var(--f-mono); font-size: 12px; padding: 3px 8px; border-radius: 6px; pointer-events: none; white-space: nowrap; }
.joy { position: absolute; left: 18px; bottom: 18px; width: 110px; height: 110px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); background: rgba(10,12,18,.35); pointer-events: none; }
.joy i { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(241,176,63,.55); border: 2px solid var(--warn); }
.rbtns { position: absolute; right: 12px; bottom: 14px; display: grid; gap: 8px; justify-items: end; }
.rb { pointer-events: auto; font-family: var(--f-mono); font-size: 12px; color: var(--ink); background: rgba(10,12,18,.8); border: 1px solid var(--line); border-radius: 22px; padding: 10px 14px; cursor: pointer; min-width: 96px; }
.rb.act { font-family: var(--f-display); font-size: 14px; background: var(--warn); color: #15110a; border-color: var(--warn); min-width: 120px; padding: 14px 16px; }
.rb.act:disabled { background: rgba(10,12,18,.6); color: var(--muted); border-color: var(--line); }
.rb.on { border-color: var(--ok); color: var(--ok); }
.rb.glow { background: var(--warn); color: #15110a; border-color: var(--warn); animation: ghold 1s infinite; }
.intro .k { font-family: var(--f-mono); font-size: 13px; color: var(--warn); font-weight: 400; }
.joy[hidden], .rbtns[hidden], .aimtip[hidden] { display: none; }
.steps { position: absolute; left: 10px; right: 54px; top: 10px; background: rgba(10,12,18,.88); border: 1px solid var(--warn); border-radius: 8px; padding: 7px 10px; font-size: 13.5px; line-height: 1.35; pointer-events: none; }
.steps b { display: block; font-family: var(--f-mono); font-weight: 400; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--warn); }
.help { position: absolute; right: 10px; top: 10px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: rgba(10,12,18,.85); color: var(--ink); font-family: var(--f-display); font-size: 17px; cursor: pointer; }
.howto { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14px; color: #dcd8cf; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.intro { overflow-y: auto; justify-content: flex-start; }
.steps[hidden], .modes[hidden] { display: none; }
.meter { display: flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.meter b { font-weight: 400; color: var(--ink); }
.meter .nbar i { transition: width .1s linear; }
.obj { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; font-size: 13px; color: var(--muted); }
.obj li::before { content: "○ "; color: var(--muted); }
.obj li.ok { color: var(--ink); } .obj li.ok::before { content: "● "; color: var(--ok); }
.note { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.fade { animation: fade .35s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.shake { animation: shake .4s; }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
@media (prefers-reduced-motion: reduce) { .fade, .shake { animation: none; } }
@media (max-height: 640px) { .art { max-height: 24vh; } .caption { font-size: 16px; } }
@media (max-width: 360px) { .locs { grid-template-columns: 1fr; } }
</style>

};

// --- shared: supplies (only if something is missing) ---
S.supply = {

const LOOK = {
  safe: ["над ним кружит вертолёт, по периметру прожекторы, у ворот очередь стоит спокойно", "видны военные «Уралы», люди проходят по одному через пост"],
  overrun: ["ворота распахнуты, у входа горит машина, внутри фигуры медленно бредут по кругу", "никакого движения у поста, на земле лежат люди, над зданием — чёрный дым"],
};

    return g.rumorText || "Ты ничего не знаешь о пунктах. Придётся выбрать наугад.";
  },
  ask: g => g.attempts ? "Куда теперь?" : "Куда идёшь?",
  choices: g => g.points.filter(p => !p.tried).map(p => ({ t: p.name, v: "mid", noVerdict: true, go: g => { g.target = p; return { next: "route" }; } })),
};
S.route = {

  ],
  timeout: { v: "mid", tip: "Маршрут нужно продумать до выхода.", go: g => { g.risk = 0.3; return { next: "meet", out: "Ты выходишь наугад." }; } },
};
S.meet = {

      { t: "Пробегаю мимо на скорости", v: "bad", tip: "Бег рядом с ним — звук и движение прямо под носом.", go: () => chance(0.45) ? { end: "bitten", out: "Ты почти проскочил. Он разворачивается на звук и цепляет тебя за руку." } : { next: "gate", out: "Ты проскакиваешь. Сзади хрип и шарканье." } },
    ],
    kid: [

      { t: "Подбегаю, обнимаю и проверяю взрослого рядом", v: "bad", tip: "Никогда не трогай лежащие тела. Сначала дистанция и наблюдение.", go: () => chance(0.5) ? { end: "bitten", out: "Ты наклоняешься к лежащему. Он резко хватает тебя за лодыжку." } : { next: "gate", out: "Взрослый мёртв по-настоящему. Ты уводишь девочку." } },
      { t: "Прохожу мимо", v: "mid", tip: "Ты спас себя. Иногда это всё, что можно сделать.", go: () => ({ next: "gate", out: "Ты не оглядываешься." }) },
    ],
  }[g.meet]),
  timeout: { v: "mid", tip: "Ты замешкался посреди улицы. Это самое опасное.", go: g => chance(g.risk || 0.3) ? { end: "bitten", out: "Пока ты стоял, сзади подошли." } : { next: "gate", out: "Ты наконец идёшь дальше." } },
};
S.gate = {
  label: "Пункт", art: () => G.target.kind === "safe" ? "gate" : "gateDead", timer: 8, place: () => G.target.name, clock: "09:40",
  enter: g => { g.target.tried = true; g.attempts++; },
  text: g => g.target.kind === "safe"
    ? `Блокпост. Бетонные блоки, колючая проволока. Солдат вскидывает автомат: <q>Стоять! Руки вверх! Покажи руки! Закатай рукава, повернись!</q>${g.f.kid ? " Аня прячется за тебя." : ""}`
    : "У ворот никого. Шлагбаум сломан, на земле брошенные сумки. Внутри, за забором, фигуры медленно бредут по кругу. Тишина.",
  ask: g => g.target.kind === "safe" ? "Дуло смотрит на тебя." : "Пункт пал. Что делаешь?",

    { t: "Медленно поднимаю руки, закатываю рукава, поворачиваюсь", v: "good", tip: "На посту проверяют всех. Медленные движения, руки на виду, выполняй команды. Ты для них — потенциально заражённый.", go: () => ({ end: "saved", out: "Солдат светит фонарём на руки, шею, лодыжки. Кивает. <q>Проходи. Борт через двадцать минут.</q>" }) },
    { t: "Бегу к нему: «Я здоров, пустите!»", v: "bad", tip: "Резкое движение к посту выглядит как атака. Сначала команды, потом слова.", go: () => chance(0.5) ? { end: "shot", out: "Очередь в воздух, вторая — под ноги. Тебя отгоняют. Ворота закрываются." } : { end: "saved", out: "Тебя валят на землю, крутят, проверяют. Обошлось, но синяки останутся." } },

  ] : [
    { t: "Захожу — вдруг там кто-то живой", v: "bad", tip: "Признаки павшего пункта: открытые ворота, нет охраны, медленное движение внутри. Не заходи.", go: () => ({ end: "bitten", out: "Три шага за ворота. Фигуры поворачиваются разом." }) },

};
